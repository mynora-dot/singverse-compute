name: singverse-compute-images
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: images-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  preflight:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the exact published Release
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/docker/resolve-release.py
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.revision }}
      - name: Check all release destinations before building
        if: steps.source.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: python3 infra/docker/release.py validate
  build:
    needs: preflight
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ needs.preflight.outputs.revision }}
      SINGVERSE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include: [{"variant": "base", "arch": "amd64", "runner": "ubuntu-24.04"}, {"variant": "base", "arch": "arm64", "runner": "ubuntu-24.04-arm"}, {"variant": "cpu", "arch": "amd64", "runner": "ubuntu-24.04"}, {"variant": "cpu", "arch": "arm64", "runner": "ubuntu-24.04-arm"}, {"variant": "uvr", "arch": "amd64", "runner": "ubuntu-24.04"}, {"variant": "uvr", "arch": "arm64", "runner": "ubuntu-24.04-arm"}, {"variant": "cuda", "arch": "amd64", "runner": "ubuntu-24.04"}, {"variant": "rocm", "arch": "amd64", "runner": "ubuntu-24.04"}, {"variant": "rocm-native", "arch": "amd64", "runner": "ubuntu-24.04"}, {"variant": "openvino", "arch": "amd64", "runner": "ubuntu-24.04"}, {"variant": "rknn", "arch": "arm64", "runner": "ubuntu-24.04-arm"}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Make room for accelerator runtimes and OCI exports
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - name: Restore release archive for retries
        id: cached
        if: needs.preflight.outputs.publish == 'true'
        run: python3 infra/docker/release-artifact.py restore --name '${{ matrix.variant }}-${{ matrix.arch }}.oci.tar'
      - name: Build runtime release archive
        if: steps.cached.outputs.found != 'true'
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          file=infra/docker/build/compute.Dockerfile
          target="$VARIANT"
          docker buildx build --file "$file" --target "$target" --platform "linux/$ARCH" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SINGVERSE_VERSION=$SINGVERSE_VERSION" \
            --provenance=false --tag singverse:check \
            --output type=oci,dest=/tmp/image.tar .
      - name: Release build cache after exporting the archive
        if: steps.cached.outputs.found != 'true'
        run: docker buildx prune --all --force
      - name: Preserve release archive for publish retries
        if: needs.preflight.outputs.publish == 'true' && steps.cached.outputs.found != 'true'
        run: python3 infra/docker/release-artifact.py save --name '${{ matrix.variant }}-${{ matrix.arch }}.oci.tar'
  publish:
    if: needs.preflight.outputs.publish == 'true'
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      SINGVERSE_VERSION: ${{ needs.preflight.outputs.version }}
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Make room for accelerator release archives
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.revision }}
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate all destinations without printing credentials
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s' "$ACR_PASSWORD" | skopeo login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
      - name: Publish identical immutable artifacts, then update latest
        run: python3 infra/docker/release.py publish --from-release
